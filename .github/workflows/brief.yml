name: Ранковий бріф

on:
  schedule:
    # 04:00 UTC = 07:00 Київ влітку, 06:00 взимку.
    # Взимку за потреби змінити на '0 5 * * *'.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: news-brief-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: DNS через HTTPS
        run: |
          pip install httpx
          sudo $(which python) scripts/prewarm_dns.py || true
          echo "контрольна перевірка:"
          getent hosts apnews.com www.haaretz.com www3.nhk.or.jp suspilne.media feeds.a.dj.com || true

      - name: 1. Зібрати новини
        run: python scripts/collect.py

      - name: 2. Написати бріф
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/write.py

      - name: 3. Опублікувати на telegra.ph
        if: always()
        env: {TELEGRAPH_TOKEN: '${{ secrets.TELEGRAPH_TOKEN }}'}
        run: python scripts/publish.py
      - name: 4. Відправити в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send.py

      - name: 5. Зберегти в архів
        if: always()
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "змін немає" && exit 0
          git commit -m "Бріф $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "збережено"; exit 0; fi
            echo "репозиторій змінився паралельним запуском, підтягую і пробую ще ($i)"
            git pull --rebase --autostash origin main || git rebase --abort
            sleep $((i * 4))
          done
          echo "не вдалося запушити після 5 спроб"; exit 1
