name: Ранковий бріф

on:
  schedule:
    # 04:00 UTC = 07:00 Київ влітку, 06:00 взимку.
    # Взимку за потреби змінити на '0 5 * * *'.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: DNS через HTTPS
        run: |
          pip install httpx
          sudo $(which python) scripts/prewarm_dns.py || true
          echo "контрольна перевірка:"
          getent hosts apnews.com www.haaretz.com www3.nhk.or.jp suspilne.media feeds.a.dj.com || true

      - name: 1. Зібрати новини
        run: python scripts/collect.py

      - name: 2. Написати бріф
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/write.py

      - name: 3. Відправити в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send.py

      - name: 4. Зберегти в архів
        if: always()
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add digests issues state
          git diff --staged --quiet || git commit -m "Бріф $(date -u +%Y-%m-%d)"
          git push
