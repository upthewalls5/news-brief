name: Ранковий бріф

# Планувальник GitHub на безкоштовному тарифі пропускає запуски за розкладом:
# за весь час він спрацював один раз із багатьох. Тому не одна спроба, а пʼять
# із інтервалом. Перша, що дійде, робить випуск; решта бачать, що бріф за
# сьогодні вже є, і мовчки виходять.
# Час у UTC. Влітку Київ = UTC+3, взимку UTC+2 — тоді зсуньте на годину пізніше.
on:
  # Основний тригер — зовнішній сервіс, який щоранку смикає GitHub через API.
  # Він передає source=cron, і тоді діє захист від дубля.
  # Ручний запуск із інтерфейсу має source=manual і працює завжди.
  workflow_dispatch:
    inputs:
      source:
        description: 'Хто запустив: manual або cron'
        required: false
        default: 'manual'
  # Власний розклад GitHub лишається запасним: він ненадійний, за весь час
  # спрацював один раз, але хай буде як підстраховка.
  schedule:
    - cron: '25 4 * * *'
    - cron: '40 5 * * *'

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: DNS через HTTPS
        run: |
          pip install httpx
          sudo $(which python) scripts/prewarm_dns.py || true
          echo "контрольна перевірка:"
          getent hosts apnews.com www.haaretz.com www3.nhk.or.jp suspilne.media feeds.a.dj.com || true

      - name: 0. Чи потрібен випуск
        id: need
        env:
          TRIGGER_SOURCE: ${{ github.event.inputs.source || 'manual' }}
        run: python scripts/should_run.py
      - name: 1. Зібрати новини
        if: steps.need.outputs.run == 'yes'
        run: python scripts/collect.py

      - name: 1а. Підняти мертві стрічки
        if: steps.need.outputs.run == 'yes'
        continue-on-error: true
        run: python scripts/heal_feeds.py
      - name: 2. Написати бріф
        if: steps.need.outputs.run == 'yes'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/write.py

      - name: 2а. Редактори перевіряють випуск
        if: steps.need.outputs.run == 'yes'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/review.py
      - name: 3. Намалювати карту уваги й картку
        if: always() && steps.need.outputs.run == 'yes'
        run: |
          python scripts/chart.py
          python scripts/collage.py
          python scripts/preview.py
      - name: 3а. Обкладинка випуску
        if: always() && steps.need.outputs.run == 'yes'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/cover.py
      - name: 4. Опублікувати на telegra.ph
        if: always() && steps.need.outputs.run == 'yes'
        env: {TELEGRAPH_TOKEN: '${{ secrets.TELEGRAPH_TOKEN }}'}
        run: python scripts/publish.py
      - name: 5. Відправити в Telegram
        if: always() && steps.need.outputs.run == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send.py

      - name: 6. Зберегти в архів
        if: always() && steps.need.outputs.run == 'yes'
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "змін немає" && exit 0
          git commit -m "Бріф $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "збережено"; exit 0; fi
            echo "репозиторій змінився паралельним запуском, підтягую і пробую ще ($i)"
            git pull --rebase --autostash origin main || git rebase --abort
            sleep $((i * 4))
          done
          echo "не вдалося запушити після 5 спроб"; exit 1
