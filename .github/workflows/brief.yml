name: Ранковий бріф

on: {workflow_dispatch: {}, schedule: [{cron: '0 4 * * *'}]}

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: 1. Зібрати новини
        run: python scripts/collect.py
      - name: 2. Написати бріф
        env: {ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}'}
        run: python scripts/write.py
      - name: 3. Відправити в Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          TELEGRAM_CHAT_ID: '${{ secrets.TELEGRAM_CHAT_ID }}'
        run: python scripts/send.py
      - name: 4. Зберегти в архів
        if: always()
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add digests issues state
          git diff --staged --quiet || git commit -m "Бріф"
          git push
