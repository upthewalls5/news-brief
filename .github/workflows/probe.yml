name: Перевірити нові джерела

on: {workflow_dispatch: {}}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Перевірити нові джерела
        run: python scripts/check_new.py --merge
      - name: Зберегти новий список
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "змін немає" || git commit -m "Нові джерела"
          for i in 1 2 3; do git push && break; git pull --rebase --autostash origin main || git rebase --abort; done
      - name: Перевірити покриття freenewsapi
        if: false
        run: python scripts/probe_api.py
      - name: Перевірити покриття GDELT
        if: false
        run: python scripts/probe_gdelt.py
      - name: Перевірити покриття Telegram
        if: false
        run: python scripts/probe_telegram.py
      - name: Зберегти результат
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "змін немає" && exit 0
          git commit -m "Покриття API $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "збережено"; exit 0; fi
            git pull --rebase --autostash origin main || git rebase --abort
            sleep $((i * 4))
          done
          exit 1
