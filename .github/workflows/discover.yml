name: Перевірити стрічки

# Запускається вручну: вкладка Actions -> "Перевірити стрічки" -> Run workflow.
# Проганяє всі видання з sources.csv, знаходить робочі RSS і пише звіт.
# Повна перевірка раз на тиждень, у неділю о 02:00 UTC. Ловить стрічки,
# які померли тихо: сайт переїхав, змінив CMS, прибрав розділ.
# Між перевірками цим займається heal_feeds.py, який піднімає окремі
# джерела після кількох днів мовчання.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: DNS через HTTPS
        run: |
          pip install httpx
          sudo $(which python) scripts/prewarm_dns.py || true
          echo "контрольна перевірка:"
          getent hosts apnews.com www.haaretz.com www3.nhk.or.jp suspilne.media feeds.a.dj.com || true
      - run: python scripts/discover.py
      - name: Зберегти результат
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "змін немає" && exit 0
          git commit -m "Перевірка стрічок $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            if git push; then echo "збережено"; exit 0; fi
            echo "репозиторій змінився паралельним запуском, підтягую і пробую ще ($i)"
            git pull --rebase --autostash origin main || git rebase --abort
            sleep $((i * 4))
          done
          echo "не вдалося запушити після 5 спроб"; exit 1
