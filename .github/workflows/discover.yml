name: Перевірити стрічки

on: {workflow_dispatch: {}}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/discover.py
      - name: Зберегти результат
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add feeds.json feed-report.md
          git diff --staged --quiet || git commit -m "Перевірка стрічок"
          git push
