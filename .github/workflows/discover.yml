name: Перевірити стрічки

# Запускається вручну: вкладка Actions -> "Перевірити стрічки" -> Run workflow.
# Проганяє всі видання з sources.csv, знаходить робочі RSS і пише звіт.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: DNS через HTTPS
        run: |
          pip install httpx
          sudo $(which python) scripts/prewarm_dns.py || true
          echo "контрольна перевірка:"
          getent hosts apnews.com www.haaretz.com www3.nhk.or.jp suspilne.media feeds.a.dj.com || true
      - run: python scripts/discover.py
      - name: Зберегти результат
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add feeds.json feed-report.md
          git diff --staged --quiet || git commit -m "Перевірка стрічок $(date -u +%Y-%m-%d)"
          git push
